name: Reusable Flow

on:
  workflow_dispatch:
    inputs:
      browser:
        type: choice
        required: true
        description: What browser should be used for the test?
        default: Chrome
        options:
          - Chrome
          - Firefox
      url:
        required: true
        description: What url will be used?
        default: 'https://the-internet.herokuapp.com'
      expectedTitle:
        required: true
        description: Text the page title must contain
        default: 'The Internet'

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: ./.github/reusableFlows/setup

      - name: Build and test with Maven
        run: mvn -B clean test -Dbrowser=${{github.event.inputs.browser}} -Durl=${{github.event.inputs.url}} "-DexpectedTitle=${{github.event.inputs.expectedTitle}}"

      - name: Archieve Reports
        uses: ./.github/reusableFlows/archieve